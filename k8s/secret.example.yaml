# Kopyalayıp değerleri doldurun ve uygulayın; gerçek secret'ı repoya koymayın:
#   kubectl -n asset-portfoyu apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: asset-portfoyu
type: Opaque
stringData:
  POSTGRES_PASSWORD: "degistir-beni"
  # Kurum içi bir PostgreSQL kullanılacaksa postgres.yaml'ı kustomization'dan çıkarıp burayı ona yönlendirin
  DATABASE_URL: "postgresql://portfoy:degistir-beni@asset-portfoyu-db:5432/portfoy"
  # AUTH_MODE=basic için (opsiyonel): "derin:parola1,guner:parola2"
  BASIC_USERS: ""
