apiVersion: v1
kind: Service
metadata:
  name: asset-portfoyu-db
spec:
  selector: {app: asset-portfoyu-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asset-portfoyu-db
spec:
  serviceName: asset-portfoyu-db
  replicas: 1
  selector:
    matchLabels: {app: asset-portfoyu-db}
  template:
    metadata:
      labels: {app: asset-portfoyu-db}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: portfoy}
            - {name: POSTGRES_USER, value: portfoy}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: asset-portfoyu, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "portfoy", "-d", "portfoy"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
