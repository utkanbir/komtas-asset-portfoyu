services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfoy
      POSTGRES_USER: portfoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfoy}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoy -d portfoy"]
      interval: 3s
      retries: 20
  app:
    build: .
    image: komtas/asset-portfoyu:local
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://portfoy:${POSTGRES_PASSWORD:-portfoy}@db:5432/portfoy
      AUTH_MODE: ${AUTH_MODE:-none}
      WRITERS: ${WRITERS:-*}
      BASIC_USERS: ${BASIC_USERS:-}
    ports: ["8080:8080"]
volumes:
  pgdata:
